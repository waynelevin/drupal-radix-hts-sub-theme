# Schema for the configuration files of the hts theme.

hts.settings:
  type: theme_settings
  label: 'hts settings'
  mapping:
    bootswatch:
      type: string
      label: 'Bootswatch theme (empty for default Bootstrap)'
    navbar_color:
      type: string
      label: 'Navbar background colour (Bootstrap bg-* suffix, empty for none)'
    navbar_alignment:
      type: string
      label: 'Navbar menu alignment (left, center or right)'
    font:
      type: string
      label: 'Font (empty for the Bootswatch theme default)'
    table_striped:
      type: boolean
      label: 'Stripe table rows'
    table_row_padding:
      type: string
      label: 'Table row top and bottom padding (empty for the Bootswatch theme default)'
